name: Continuous Deployment to Remote VPS via SSH

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/spring-boot-app:latest

jobs:
  build-and-push:
    name: Build & Push Container Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build Fat JAR
        run: |
          chmod +x gradlew
          ./gradlew bootJar --no-daemon

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: ${{ env.IMAGE_NAME }}

  deploy-to-vps:
    name: Deploy Container to Remote VPS
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: SSH into VPS and Run Deployment Script
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "=== 1. Đăng nhập Registry trên VPS ==="
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin || true

            echo "=== 2. Kéo Container Image mới nhất ==="
            docker pull ${{ env.IMAGE_NAME }} || true

            echo "=== 3. Dừng và gỡ bỏ Container cũ ==="
            docker stop spring-boot-prod || true
            docker rm spring-boot-prod || true

            echo "=== 4. Khởi chạy Container phiên bản mới ==="
            docker run -d \
              --name spring-boot-prod \
              --restart unless-stopped \
              -p 8080:8080 \
              ${{ env.IMAGE_NAME }}

            echo "=== 5. Chờ và kiểm tra trạng thái sức khỏe (Health Check) ==="
            sleep 8
            curl -f http://localhost:8080/health || exit 1
            echo "Triển khai VPS thành công 100%!"
